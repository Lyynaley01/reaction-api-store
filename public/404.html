<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — REACTION API</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 8% 20%, rgba(255, 178, 210, .25), transparent 25%),
        radial-gradient(circle at 92% 80%, rgba(177, 154, 255, .22), transparent 28%),
        #fffaf7;
      color: #20202a;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid #e8e1e1;
      background: rgba(255, 253, 251, .92);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .logo span {
      color: #e98bb7;
    }

    .nav {
      font-size: 15px;
      color: #55525b;
      font-weight: 600;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px 70px;
    }

    .card {
      position: relative;
      width: min(620px, 100%);
      overflow: hidden;
      text-align: center;
      padding: 58px 32px 48px;
      background: rgba(255, 255, 255, .92);
      border: 1.5px solid #ded9d9;
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(38, 31, 42, .10);
    }

    .bubble {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: #f7dce9;
      top: -105px;
      right: -75px;
      opacity: .75;
    }

    .bubble.two {
      width: 130px;
      height: 130px;
      background: #e4dcff;
      top: auto;
      right: auto;
      bottom: -75px;
      left: -55px;
    }

    .code {
      position: relative;
      font-size: clamp(86px, 20vw, 150px);
      line-height: .85;
      font-weight: 900;
      letter-spacing: -10px;
      margin-bottom: 28px;
    }

    .code .pink {
      color: #e98bb7;
    }

    .code .purple {
      color: #9d87ee;
    }

    .eyebrow {
      position: relative;
      display: inline-block;
      margin-bottom: 12px;
      color: #df78aa;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    h1 {
      position: relative;
      margin: 0;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.05;
      letter-spacing: -1.5px;
    }

    p {
      position: relative;
      max-width: 470px;
      margin: 16px auto 30px;
      color: #706c75;
      font-size: 17px;
      line-height: 1.6;
    }

    .actions {
      position: relative;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 0 25px;
      border-radius: 15px;
      border: 2px solid #292832;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    a:hover {
      transform: translateY(-2px);
    }

    .primary {
      color: #fff;
      background: #9d87ee;
      box-shadow: 0 5px 0 #7560c9;
    }

    .secondary {
      color: #292832;
      background: #fff;
    }

    .hint {
      position: relative;
      margin-top: 25px;
      color: #a09ba3;
      font-size: 12px;
    }

    @media (max-width: 520px) {
      .topbar {
        height: 68px;
        padding: 0 18px;
      }

      .logo {
        font-size: 23px;
      }

      .nav {
        display: none;
      }

      main {
        padding: 28px 16px 45px;
      }

      .card {
        padding: 48px 22px 38px;
        border-radius: 27px;
      }

      .code {
        margin-bottom: 22px;
      }

      p {
        font-size: 15px;
      }

      .actions {
        flex-direction: column;
      }

      a {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="logo">REACTION<span>API</span></div>
    <div class="nav">Page not found</div>
  </header>

  <main>
    <section class="card">
      <div class="bubble"></div>
      <div class="bubble two"></div>

      <div class="code">
        <span class="pink">4</span><span>0</span><span class="purple">4</span>
      </div>

      <div class="eyebrow">PAGE NOT FOUND</div>

      <h1>Halaman ini nggak ditemukan.</h1>

      <p>
        Sepertinya halaman yang kamu cari tidak tersedia,
        sudah dipindahkan, atau URL yang kamu masukkan kurang tepat.
      </p>

      <div class="actions">
        <a class="primary" href="/">← Kembali ke Home</a>
        <a class="secondary" href="/docs">Buka Docs</a>
      </div>

      <div class="hint">
        REACTION API · 404
      </div>
    </section>
  </main>

</body>
</html>
