<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Reaction API</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">

<div class="auth-bg">
  <span></span><span></span><span></span>
</div>

<main class="auth-shell">

  <a class="auth-brand" href="/">
    <span>REACTION</span><b>API</b>
  </a>

  <section class="auth-card">

    <div class="auth-badge">
      <i></i> MEMBER AREA
    </div>

    <h1>Welcome back.</h1>
    <p class="auth-sub">
      Login untuk mengakses dashboard dan API reaction kamu.
    </p>

    <form id="form" class="auth-form">

      <label>
        <span>Email</span>
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="nama@email.com"
          required
        >
      </label>

      <label>
        <span>Password</span>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Masukkan password"
          required
        >
      </label>

      <button class="auth-submit" type="submit">
        <span>Login</span>
        <b>→</b>
      </button>

    </form>

    <div id="msg" class="auth-message"></div>

    <div class="auth-divider">
      <span>atau</span>
    </div>

    <p class="auth-bottom">
      Belum punya akun?
      <a href="/register.html">Buat akun</a>
    </p>

  </section>

  <a class="auth-back" href="/">← Kembali ke halaman utama</a>

</main>

<script src="/app.js"></script>
<script>
const form = document.getElementById("form");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const button = form.querySelector("button");
  button.disabled = true;
  button.innerHTML = "<span>Logging in...</span>";

  msg.textContent = "";
  msg.className = "auth-message";

  try {
    const r = await api("/api/auth/login", "POST", {
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    if (r.success) {
      localStorage.setItem("token", r.token);
      location.href = "/dashboard.html";
      return;
    }

    msg.textContent = r.error || "Login gagal.";
    msg.className = "auth-message error";
  } catch (err) {
    msg.textContent = "Tidak dapat terhubung ke server.";
    msg.className = "auth-message error";
  }

  button.disabled = false;
  button.innerHTML = "<span>Login</span><b>→</b>";
});
</script>

</body>
</html>
