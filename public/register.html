<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daftar — Reaction API</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">

<div class="auth-bg">
  <span></span><span></span><span></span>
</div>

<main class="auth-shell">

  <a class="auth-brand" href="/">
    <span>REACTION</span><b>API</b>
  </a>

  <section class="auth-card">

    <div class="auth-badge">
      <i></i> CREATE ACCOUNT
    </div>

    <h1>Get started.</h1>
    <p class="auth-sub">
      Buat akun dan mulai menggunakan Reaction API.
    </p>

    <form id="form" class="auth-form">

      <label>
        <span>Nama</span>
        <input
          id="name"
          type="text"
          autocomplete="name"
          placeholder="Nama kamu"
          required
        >
      </label>

      <label>
        <span>Email</span>
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="nama@email.com"
          required
        >
      </label>

      <label>
        <span>Password</span>
        <input
          id="password"
          type="password"
          autocomplete="new-password"
          placeholder="Minimal 6 karakter"
          minlength="6"
          required
        >
      </label>

      <button class="auth-submit" type="submit">
        <span>Daftar</span>
        <b>→</b>
      </button>

    </form>

    <div id="msg" class="auth-message"></div>

    <div class="auth-divider">
      <span>atau</span>
    </div>

    <p class="auth-bottom">
      Sudah punya akun?
      <a href="/login.html">Login</a>
    </p>

  </section>

  <a class="auth-back" href="/">← Kembali ke halaman utama</a>

</main>

<script src="/app.js"></script>
<script>
const form = document.getElementById("form");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const button = form.querySelector("button");
  button.disabled = true;
  button.innerHTML = "<span>Creating...</span>";

  msg.textContent = "";
  msg.className = "auth-message";

  try {
    const r = await api("/api/auth/register", "POST", {
      name: document.getElementById("name").value.trim(),
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    if (r.success) {
      localStorage.setItem("token", r.token);
      location.href = "/dashboard.html";
      return;
    }

    msg.textContent = r.error || "Pendaftaran gagal.";
    msg.className = "auth-message error";
  } catch (err) {
    msg.textContent = "Tidak dapat terhubung ke server.";
    msg.className = "auth-message error";
  }

  button.disabled = false;
  button.innerHTML = "<span>Daftar</span><b>→</b>";
});
</script>

</body>
</html>
