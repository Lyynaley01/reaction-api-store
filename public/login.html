<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="/style.css"></head><body><main class="auth"><a class="brand" href="/">REACTION<span>API</span></a><div class="panel"><div class="eyebrow">ACCOUNT</div><h1>Login</h1><form id="form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="btn full">Login</button></form><p id="msg"></p><p>Belum punya akun? <a href="/register.html">Daftar</a></p></div></main><script src="/app.js"></script><script>document.querySelector("#form").onsubmit=async e=>{e.preventDefault();const r=await api("/api/auth/login","POST",{email:email.value,password:password.value});if(r.success){localStorage.token=r.token;location.href="/dashboard.html"}else msg.textContent=r.error}</script></body></html>
