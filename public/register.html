<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar</title><link rel="stylesheet" href="/style.css"></head><body><main class="auth"><a class="brand" href="/">REACTION<span>API</span></a><div class="panel"><div class="eyebrow">ACCOUNT</div><h1>Buat akun</h1><form id="form"><input id="name" placeholder="Nama"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password min. 6 karakter" required><button class="btn full">Daftar</button></form><p id="msg"></p><p>Sudah punya akun? <a href="/login.html">Login</a></p></div></main><script src="/app.js"></script><script>document.querySelector("#form").onsubmit=async e=>{e.preventDefault();const r=await api("/api/auth/register","POST",{name:name.value,email:email.value,password:password.value});if(r.success){localStorage.token=r.token;location.href="/dashboard.html"}else msg.textContent=r.error}</script></body></html>
