<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard — Reaction API</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="nav">
  <a class="brand" href="/">REACTION<span>API</span></a>

  <nav>
    <a href="/docs.html">Docs</a>
    <button class="btn small" onclick="logout()">Logout</button>
  </nav>
</header>

<main class="dashboard">

  <div class="dash-head">
    <div>
      <div class="eyebrow">DASHBOARD</div>
      <h1 id="hello">Account</h1>
    </div>

    <div class="coin">
      <small>COIN</small>
      <b id="coins">0</b>
    </div>
  </div>


  <!-- API ACCESS -->

  <section class="panel">

    <div class="eyebrow">API ACCESS</div>
    <h2>API Connection</h2>

    <div class="keyrow">
      <code id="key">Loading...</code>

      <button class="btn small" onclick="copyKey()">
        Copy Key
      </button>

      <button class="btn small ghost" onclick="regen()">
        Regenerate
      </button>
    </div>

    <p class="muted">
      API key ini digunakan untuk mengakses Reaction API.
      Jangan bagikan kepada orang lain.
    </p>

    <div style="margin-top:18px">

      <label>
        Base URL

        <div class="keyrow" style="margin-top:7px">
          <code id="baseUrl">https://reaction-api-store.vercel.app</code>

          <button
            class="btn small ghost"
            onclick="copyText('https://reaction-api-store.vercel.app','Base URL')">
            Copy
          </button>
        </div>
      </label>

    </div>

    <div style="margin-top:18px">

      <label>
        Reaction Endpoint

        <div class="keyrow" style="margin-top:7px">
          <code id="endpointUrl">https://reaction-api-store.vercel.app/api/v1/reaction</code>

          <button
            class="btn small ghost"
            onclick="copyText('https://reaction-api-store.vercel.app/api/v1/reaction','Endpoint')">
            Copy
          </button>
        </div>
      </label>

    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">

      <a class="btn" href="/docs.html">
        Open API Docs
      </a>

    </div>

  </section>


  <!-- BUY COIN -->

  <section class="panel">

    <div class="eyebrow">BALANCE</div>
    <h2>Beli Coin</h2>

    <div class="buygrid">

      <label>
        Paket

        <select id="duration">
          <option value="permanent">Permanen</option>
          <option value="30_days">30 Hari</option>
          <option value="7_days">7 Hari</option>
        </select>
      </label>

      <label>
        Coin

        <input
          id="buyCoins"
          type="number"
          min="100"
          step="100"
          readonly
        >
      </label>

    </div>

    <p id="packageInfo" class="muted"></p>

    <p>
      Total:
      <b id="price">Rp0</b>
    </p>

    <button class="btn" onclick="createOrder()">
      Buat Order
    </button>

    <p id="orderMsg" class="muted"></p>

  </section>


  <!-- ORDERS -->

  <section class="panel">

    <div class="eyebrow">TRANSACTIONS</div>
    <h2>Order</h2>

    <div id="orders">
      Loading...
    </div>

  </section>


  <!-- USAGE -->

  <section class="panel">

    <div class="eyebrow">ACTIVITY</div>
    <h2>Riwayat API</h2>

    <div id="usage">
      Loading...
    </div>

  </section>

</main>

<script src="/app.js"></script>
<script src="/dashboard.js"></script>

</body>
</html>
